apiVersion: apps/v1
kind: Deployment
metadata:
  name: kong
  namespace: gateway
  labels:
    app: kong
    environment: staging
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kong
  template:
    metadata:
      labels:
        app: kong
        environment: staging
    spec:
      containers:
        - name: kong
          image: kong:3.9.3
          imagePullPolicy: IfNotPresent
          env:
            - name: KONG_DATABASE
              value: "off"
            - name: KONG_DECLARATIVE_CONFIG
              value: /kong/declarative/kong.yaml
            - name: KONG_PROXY_LISTEN
              value: 0.0.0.0:8000
            - name: KONG_ADMIN_LISTEN
              value: 127.0.0.1:8001
            - name: KONG_STATUS_LISTEN
              value: 0.0.0.0:8100
          ports:
            - name: proxy
              containerPort: 8000
            - name: status
              containerPort: 8100
          volumeMounts:
            - name: configuration
              mountPath: /kong/declarative/kong.yaml
              subPath: kong.yaml
              readOnly: true
          readinessProbe:
            httpGet:
              path: /status
              port: status
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /status
              port: status
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
      volumes:
        - name: configuration
          configMap:
            name: kong-config
---
apiVersion: v1
kind: Service
metadata:
  name: kong-proxy
  namespace: gateway
  labels:
    app: kong
    environment: staging
spec:
  type: LoadBalancer
  loadBalancerSourceRanges:
    - "189.4.123.56/32"
  externalTrafficPolicy: Local
  selector:
    app: kong
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: proxy
